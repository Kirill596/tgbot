name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smena_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/smena_test
      - run: python -m alembic upgrade head && python -m alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/smena_test
