services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smena
      POSTGRES_PASSWORD: smena
      POSTGRES_DB: smena
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smena"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smena:smena@db:5432/smena
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
